name = "kudoma-portfolio-github-activity"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Keep the environment variables set in the Cloudflare dashboard
# (GITHUB_TOKEN as a secret, optionally GITHUB_USERNAME, and optionally
