name: Deploy article-backend

on:
  push:
    branches:
      - main
    paths:
      - 'workers/article-backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-article-backend
  cancel-in-progress: false

jobs:
  deploy-article-backend:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Deploy kudoma-portfolio-article-backend
        working-directory: workers/article-backend
        run: npx wrangler@4.156.2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Slack
        if: ${{ !cancelled() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          WORKER: kudoma-portfolio-article-backend
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then ICON=":white_check_mark:"; LABEL="deployed"; else ICON=":x:"; LABEL="deploy FAILED"; fi
          jq -n --arg text "$ICON $WORKER $LABEL
          ${COMMIT_MESSAGE%%$'\n'*}
          $RUN_URL" '{text: $text}' | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
