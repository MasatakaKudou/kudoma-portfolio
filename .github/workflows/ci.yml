name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm ci --prefix workers
      - run: npm run typecheck --prefix workers
      - run: npm test --prefix workers
