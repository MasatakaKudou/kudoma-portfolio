name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: Reactアプリのビルド
        run: npm run build

      - name: GitHub Pages 用に dist をセットアップ
        run: |
          mkdir -p public
          cp -r build/* public/

      - name: GitHub Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
  notify:
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then ICON=":white_check_mark:"; LABEL="deployed"; else ICON=":x:"; LABEL="deploy FAILED"; fi
          jq -n --arg text "$ICON kudoma-portfolio (GitHub Pages) $LABEL
          ${COMMIT_MESSAGE%%$'\n'*}
          $RUN_URL" '{text: $text}' | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
