name: Deploy github-activity

on:
  push:
    branches:
      - main
    paths:
      - 'workers/github-activity/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-github-activity
  cancel-in-progress: false

jobs:
  deploy-github-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: workers/package-lock.json

      # wrangler is a devDependency of workers/, so Dependabot keeps it up to date.
      - run: npm ci --prefix workers

      - name: Deploy kudoma-portfolio-github-activity
        working-directory: workers/github-activity
        run: npx --no-install wrangler deploy --var CACHE_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Slack
        if: ${{ !cancelled() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          WORKER: kudoma-portfolio-github-activity
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then ICON=":white_check_mark:"; LABEL="deployed"; else ICON=":x:"; LABEL="deploy FAILED"; fi
          jq -n --arg text "$ICON $WORKER $LABEL
          ${COMMIT_MESSAGE%%$'\n'*}
          $RUN_URL" '{text: $text}' | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
