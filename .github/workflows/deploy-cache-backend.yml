name: Deploy cache-backend

on:
  push:
    branches:
      - main
    paths:
      - 'workers/cache-backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cache-backend
  cancel-in-progress: false

jobs:
  deploy-cache-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Deploy kudoma-portfolio-cache-backend
        working-directory: workers/cache-backend
        run: npx wrangler@4.156.2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CACHE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
